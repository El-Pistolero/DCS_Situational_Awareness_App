name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t .
      - name: Test the DCS Lua scripts under Lua 5.1 (DCS's version)
        run: |
          sudo apt-get install -y -q lua5.1
          lua5.1 dcs-scripts/test_bridge.lua
          lua5.1 dcs-scripts/test_hook.lua

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m PyInstaller --noconfirm --clean dcs-sa.spec
      - name: Smoke test the exe's bundled code
        shell: pwsh
        run: |
          $p = Start-Process dist\DCS-SA.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "DCS-SA.exe exited early with code $($p.ExitCode)" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: DCS-SA-windows
          path: dist/DCS-SA.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DCS-SA.exe
