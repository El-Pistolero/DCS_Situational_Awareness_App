name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t .
      - name: Test the DCS Lua scripts under Lua 5.1 (DCS's version)
        run: |
          sudo apt-get install -y -q lua5.1
          lua5.1 dcs-scripts/test_bridge.lua
          lua5.1 dcs-scripts/test_hook.lua

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-desktop.txt
      # Every push to the default branch becomes a release, so each build needs
      # its own version (see packaging/build_version.py).
      - name: Work out this build's version
        id: ver
        shell: bash
        run: |
          v=$(python packaging/build_version.py "${{ github.run_number }}" "${{ github.ref_type == 'tag' && github.ref_name || '' }}")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"
      - run: python -m PyInstaller --noconfirm --clean dcs-sa.spec
      - name: Smoke test the exe's bundled code
        shell: pwsh
        run: |
          $p = Start-Process dist\DCS-SA.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "DCS-SA.exe exited early with code $($p.ExitCode)" }
          Stop-Process $p
      - name: Build installer (desktop + Start menu icons)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if (-not (Test-Path dist\DCS-SA-Setup.exe)) { throw "installer was not built" }
      - uses: actions/upload-artifact@v4
        with:
          name: DCS-SA-windows
          path: |
            dist/DCS-SA-Setup.exe
            dist/DCS-SA.exe
      # A release per successful build of the default branch: it is the download
      # link that needs no GitHub login, and what the app's update check reads.
      - name: Publish the release
        if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DCS SA ${{ steps.ver.outputs.version }}
          body: |
            ${{ github.event.head_commit.message }}

            ---
            Download **DCS-SA-Setup.exe** below and run it. It replaces any older
            version and keeps your recordings, settings and the DCS bridge.
            First time here? Start with [GETTING_STARTED.md](https://github.com/${{ github.repository }}/blob/HEAD/GETTING_STARTED.md).
          files: |
            dist/DCS-SA-Setup.exe
            dist/DCS-SA.exe
