# Copy to dcs-sa.toml (next to DCS-SA.exe, in Documents\DCS-SA, or in the
# folder you run from).  Every setting is optional.

# Your DCS pilot name(s).  Normally read automatically from your DCS logbook.
# player_names = ["Ethan"]

# Extra folders to scan for .acmi recordings (Documents\Tacview is automatic).
# recording_dirs = ['D:\Tacview']

[tacview]
host = "127.0.0.1"        # PC running DCS + Tacview exporter
port = 42674
password = ""
autoconnect = false       # connect to real-time telemetry on start

[bridge]
enabled = true            # listen for the DCS-SA Export.lua bridge
port = 42680
